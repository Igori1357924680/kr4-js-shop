<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки на покупку гаджета в PlayTable.">
  <title>Заявка — PlayTable</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">PlayTable</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <h1 class="section__title">Оформление заявки</h1>
      <p class="section__text">Заполните форму — мы свяжемся с вами в течение 15 минут.</p>

      <form class="order-form" action="#" method="post">
        <div class="order-form__field">
          <label class="order-form__label" for="name">Имя</label>
          <input class="order-form__input" id="name" name="name" type="text" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="email">E-mail</label>
          <input class="order-form__input" id="email" name="email" type="email" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="phone">Телефон</label>
          <input class="order-form__input" id="phone" name="phone" type="tel" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="topic">Тема заявки</label>
          <select class="order-form__input" id="topic" name="topic" required>
            <option value="">— выберите —</option>
            <option value="smartphone">Смартфон</option>
            <option value="audio">Наушники</option>
            <option value="watch">Умные часы</option>
            <option value="accessory">Аксессуар</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="comment">Комментарий</label>
          <textarea class="order-form__input order-form__input--textarea" id="comment" name="comment" rows="4"></textarea>
        </div>

        <div class="order-form__field order-form__field--checkbox">
          <input class="order-form__checkbox" id="agree" name="agree" type="checkbox" required>
          <label class="order-form__label order-form__label--checkbox" for="agree">Согласен на обработку персональных данных</label>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Отправить заявку</button>
          <button class="button button--ghost button--disabled" type="button" disabled>Отправить позже</button>
        </div>
      </form>
    </section>
  <main id="main-content">

  <footer class="site-footer">
    <p class="site-footer__text">© 2026 PlayTable. Контрольная работа №1.</p>
  </footer>

  <button class="to-top" id="toTop" aria-label="Наверх">↑</button>
  <script src="js/main.js"></script>
</body>
</html>
